name: Release

# Push a version tag to build the Windows installer and publish it (plus the
# auto-update feed, latest.yml) to a GitHub Release.
#
#   1. bump "version" in apps/desktop/package.json (e.g. 0.2.0)
#   2. git commit -am "release 0.2.0"
#   3. git tag v0.2.0 && git push --tags
#
# The tag and the package.json version must match.
#
# Channels: a plain tag (v0.2.3) publishes a STABLE release (marked "Latest");
# a prerelease tag whose version has a hyphen (v0.3.0-beta.1) publishes a BETA
# release (marked pre-release, not "Latest"). The app's Stable channel tracks
# the former; the Beta channel (Settings → App updates) also sees the latter.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sanity check
        run: pnpm run check

      - name: Build & publish installer
        run: pnpm run release:win
        env:
          # electron-builder uploads the installer + latest.yml to the release.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the release (stable = latest, prerelease tag = beta)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '-') {
            # Prerelease tag (e.g. v0.3.0-beta.1): beta channel only, not "Latest".
            gh release edit $tag --draft=false --prerelease=true
          } else {
            # Plain tag: stable, marked as the "Latest" release.
            gh release edit $tag --draft=false --prerelease=false --latest
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
