appId: com.stardewmods.manager
productName: Stardew Mod Manager
directories:
  output: release
  buildResources: build
# Auto-update reads GitHub Releases. Set owner/repo to your repository; the token
# comes from GH_TOKEN when running `release:win`.
publish:
  provider: github
  owner: Kode-Red
  repo: stardew-mods-app
files:
  - out/**
  - "!**/*.map"
# icon.png is read at runtime to set the window/taskbar icon (the exe itself isn't
# edited — see signAndEditExecutable below).
extraResources:
  - from: build/icon.png
    to: icon.png
win:
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}
  # Editing/signing the packaged exe pulls electron-builder's winCodeSign tool,
  # whose macOS symlinks can't be extracted on Windows without Developer Mode.
  # Disable it: the installer + shortcuts still get build/icon.ico (via NSIS), and
  # the running app sets its icon from icon.png at runtime.
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
mac:
  target:
    - dmg
  category: public.app-category.games
linux:
  target:
    - AppImage
  category: Game
