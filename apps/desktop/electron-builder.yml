appId: com.stardewmods.manager
productName: Stardew Mod Manager
directories:
  output: release
  buildResources: build
# Auto-update reads GitHub Releases. Set owner/repo to your repository; the token
# comes from GH_TOKEN when running `release:win`.
publish:
  provider: github
  owner: Kode-Red
  repo: stardew-mods-app
files:
  - out/**
  - "!**/*.map"
# icon.png is read at runtime to set the window/taskbar icon (the exe itself isn't
# edited — see signAndEditExecutable below).
extraResources:
  - from: build/icon.png
    to: icon.png
win:
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}
  # Keep electron-builder's own sign/edit off — it pulls the winCodeSign tool whose
  # macOS symlinks can't extract on Windows without Developer Mode. Instead we embed
  # build/icon.ico into the exe ourselves in the afterPack hook (rcedit), which edits
  # the PE directly and never needs winCodeSign.
  signAndEditExecutable: false
afterPack: ./scripts/after-pack.mjs
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
mac:
  target:
    - dmg
  category: public.app-category.games
linux:
  target:
    - AppImage
  category: Game
  maintainer: Kode-Red
  synopsis: Mod manager for Stardew Valley
  artifactName: ${productName}-${version}.${ext}
